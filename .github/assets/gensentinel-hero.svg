<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GenSentinel — Generate secrets. Keep them yours.</title>
  <desc id="desc">Dark indigo banner with GenSentinel typography, glowing security shield, and Web Crypto privacy highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e24"/>
      <stop offset="55%" stop-color="#111236"/>
      <stop offset="100%" stop-color="#0b1a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6d5dfc" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8493c9" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#818cf8" flood-opacity=".32"/></filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1010" cy="160" r="225" fill="url(#glow)"/>
  <ellipse cx="1058" cy="295" rx="170" ry="26" fill="#22d3ee" opacity=".12" filter="url(#soft)"/>
  <path d="M0 0H1200V360H0Z" fill="none" stroke="#8b94d1" stroke-opacity=".32" stroke-width="2"/>

  <rect x="69" y="48" width="166" height="31" rx="15.5" fill="#7773ff" fill-opacity=".12" stroke="#9992ff" stroke-opacity=".45"/>
  <circle cx="86" cy="64" r="4" fill="#5eead4"/>
  <text x="100" y="69" fill="#c4c7ff" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.6">PRIVACY FIRST</text>

  <text x="65" y="171" font-family="Arial,Helvetica,sans-serif" font-size="79" font-weight="800" letter-spacing="-3.5" fill="#f8faff">Gen<tspan fill="url(#accent)">Sentinel</tspan></text>
  <text x="69" y="210" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#b8c4e5">Vos secrets. Votre navigateur. Rien d'autre.</text>
  <path d="M69 236H645" stroke="url(#accent)" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>

  <g font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.1" font-size="12">
    <rect x="69" y="268" width="161" height="38" rx="10" fill="#a78bfa" fill-opacity=".11" stroke="#a78bfa" stroke-opacity=".33"/>
    <text x="91" y="292" fill="#d9d1ff">10 GÉNÉRATEURS</text>
    <rect x="242" y="268" width="144" height="38" rx="10" fill="#2dd4bf" fill-opacity=".09" stroke="#2dd4bf" stroke-opacity=".34"/>
    <text x="265" y="292" fill="#a6f3df">100 % LOCAL</text>
    <rect x="398" y="268" width="145" height="38" rx="10" fill="#818cf8" fill-opacity=".10" stroke="#818cf8" stroke-opacity=".33"/>
    <text x="422" y="292" fill="#c8cfff">WEB CRYPTO</text>
  </g>

  <g stroke="#8892d0" stroke-opacity=".22" fill="none" stroke-width="1.5">
    <path d="M784 60H852L885 93"/>
    <path d="M1167 87H1108L1076 119"/>
    <path d="M780 297H857L893 261"/>
    <path d="M1160 276H1102L1071 245"/>
    <circle cx="784" cy="60" r="3" fill="#a5b4fc" stroke="none"/>
    <circle cx="1167" cy="87" r="3" fill="#5eead4" stroke="none"/>
    <circle cx="780" cy="297" r="3" fill="#5eead4" stroke="none"/>
    <circle cx="1160" cy="276" r="3" fill="#a5b4fc" stroke="none"/>
  </g>

  <g transform="translate(870 44)">
    <circle cx="149" cy="137" r="118" fill="#17244a" stroke="#8193d8" stroke-opacity=".33" stroke-width="2"/>
    <circle cx="149" cy="137" r="97" fill="none" stroke="#5eead4" stroke-opacity=".16" stroke-width="1" stroke-dasharray="3 8"/>
    <path d="M149 42L219 70V128C219 183 188 224 149 243C110 224 79 183 79 128V70L149 42Z" fill="#131b3c" stroke="url(#shield)" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)"/>
    <path d="M149 62L200 84V127C200 166 178 197 149 215C120 197 98 166 98 127V84L149 62Z" fill="#1b2850" fill-opacity=".63"/>
    <rect x="122" y="119" width="54" height="47" rx="8" fill="none" stroke="#b6c2ff" stroke-width="5"/>
    <path d="M133 119V104C133 82 165 82 165 104V119" stroke="#b6c2ff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="149" cy="139" r="5" fill="#5eead4"/>
    <path d="M149 145V153" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1158" y="341" text-anchor="end" fill="#8da0c9" font-size="11" font-family="Arial,Helvetica,sans-serif" letter-spacing="2">OPEN SOURCE · MIT</text>
</svg>